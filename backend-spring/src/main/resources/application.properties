# ---- Server ----
server.port=8080

# ---- Database (H2 in-memory: runs with zero setup) ----
spring.datasource.url=jdbc:h2:mem:telecare;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update = Hibernate creates/updates tables from your @Entity classes.
# This is the "Spring integrates with ORM" magic: no SQL written by hand.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 web console at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:telecare)
spring.h2.console.enabled=true

